on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

name: rebuild-data

permissions: read-all

jobs:
  rebuild-from-clean-clone:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the comparison reads the first commit's tables
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::readr, any::dplyr, any::tidyr, any::stringr, any::here, any::usethis
      - name: Rebuild every table from data-raw/source
        run: Rscript data-raw/rebuild-all.R
      - name: The rebuilt panel matches the committed file, byte for byte
        run: git diff --exit-code -- data-raw/source
      - name: The rebuilt tables match the first commit's tables
        run: Rscript data-raw/compare-tables.R
