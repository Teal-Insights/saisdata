# The student's one line, on a clean library, with no compiler on the PATH.
# Run by hand once R-universe has built the tag:
#   gh workflow run verify-install.yaml -f expect_sha=<commit> -f expect_version=<version>
on:
  workflow_dispatch:
    inputs:
      expect_sha:
        description: The commit R-universe should have built
        required: false
        default: ''
      expect_version:
        description: The version R-universe should serve
        required: false
        default: ''

name: verify-install

permissions: read-all

env:
  SAISDATA_EXPECT_SHA: ${{ inputs.expect_sha }}
  SAISDATA_EXPECT_VERSION: ${{ inputs.expect_version }}

jobs:
  windows:
    runs-on: windows-latest
    name: windows-latest (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['4.3', '4.4', '4.5', 'release', 'devel']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          windows-path-include-rtools: false
      - name: Make an empty library and find R
        shell: pwsh
        run: |
          $lib = Join-Path $env:RUNNER_TEMP 'empty-student-library'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null
          "STUDENT_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $rbin = Split-Path (Get-Command Rscript).Source
          "STUDENT_RBIN=$rbin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the exact line in an interactive R session, with no compiler on the PATH
        shell: pwsh
        env:
          GITHUB_PAT: ''
          GITHUB_TOKEN: ''
        run: |
          $env:R_LIBS_USER = $env:STUDENT_LIB
          $env:PATH = "$env:STUDENT_RBIN;C:\Windows\System32;C:\Windows"
          foreach ($tool in 'gcc','make','g++','clang') { if (Get-Command $tool -ErrorAction SilentlyContinue) { throw "$tool is on the PATH" } }
          Set-Content -Path student-line.R -Value 'install.packages("saisdata", repos = "https://teal-insights.r-universe.dev")'
          Add-Content -Path student-line.R -Value 'q("no")'
          cmd /c "`"$env:STUDENT_RBIN\Rterm.exe`" --interactive --vanilla < student-line.R > student-line.log 2>&1"
          Get-Content student-line.log
          if (Select-String -Path student-line.log -Pattern 'Would you like|Yes/no/cancel|Selection:') { throw 'The install stopped to prompt' }
      - name: Load the data, open the help pages, run the example, in a fresh session
        shell: pwsh
        env:
          GITHUB_PAT: ''
          GITHUB_TOKEN: ''
        run: |
          $env:R_LIBS_USER = $env:STUDENT_LIB
          $env:PATH = "$env:STUDENT_RBIN;C:\Windows\System32;C:\Windows"
          & "$env:STUDENT_RBIN\Rscript.exe" --vanilla data-raw/verify-student-install.R use
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:STUDENT_RBIN\Rscript.exe" --vanilla -e "stopifnot(identical(list.files(.libPaths()[1]), 'saisdata')); cat('saisdata is the only package in the library\n')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    runs-on: macos-latest
    name: macos-latest (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['4.4', '4.5', 'release', 'devel']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Run the exact line in an interactive R session, with compilers trapped
        shell: bash
        env:
          GITHUB_PAT: ''
          GITHUB_TOKEN: ''
        run: |
          mkdir -p "$RUNNER_TEMP/trap" "$RUNNER_TEMP/empty-student-library"
          for tool in clang clang++ gcc g++ cc c++ make gfortran; do
            printf '#!/bin/sh\necho "$0 $*" >> "%s/compiler-calls.log"\nexit 1\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/trap/$tool"
            chmod +x "$RUNNER_TEMP/trap/$tool"
          done
          export PATH="$RUNNER_TEMP/trap:$PATH"
          export R_LIBS_USER="$RUNNER_TEMP/empty-student-library"
          printf '%s\n%s\n' 'install.packages("saisdata", repos = "https://teal-insights.r-universe.dev")' 'q("no")' > student-line.R
          R --interactive --vanilla < student-line.R 2>&1 | tee student-line.log
          if grep -E 'Would you like|Yes/no/cancel|Selection:' student-line.log; then echo 'The install stopped to prompt'; exit 1; fi
          if [ -s "$RUNNER_TEMP/compiler-calls.log" ]; then cat "$RUNNER_TEMP/compiler-calls.log"; echo 'A compiler was called'; exit 1; fi
          echo 'No compiler was called'
      - name: Load the data, open the help pages, run the example, in a fresh session
        shell: bash
        env:
          GITHUB_PAT: ''
          GITHUB_TOKEN: ''
        run: |
          export R_LIBS_USER="$RUNNER_TEMP/empty-student-library"
          Rscript --vanilla data-raw/verify-student-install.R use
          Rscript --vanilla -e "stopifnot(identical(list.files(.libPaths()[1]), 'saisdata')); cat('saisdata is the only package in the library\n')"
